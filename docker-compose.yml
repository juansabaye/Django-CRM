services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=crm_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_SUPER_PASSWORD}
      - CRM_USER_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
      - ./docker/postgres/init-rls-user.sh:/docker-entrypoint-initdb.d/init-rls-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=False
      - ENV_TYPE=production
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SWAGGER_ROOT_URL=${DOMAIN_NAME}
      - DBNAME=crm_db
      - DBUSER=crm_user
      - DBPASSWORD=${DB_PASSWORD}
      - DBHOST=db
      - DBPORT=5432
      - POSTGRES_SUPER_PASSWORD=${POSTGRES_SUPER_PASSWORD}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEFAULT_FROM_EMAIL=noreply@vecireal.com
      - CORS_ALLOW_ALL=False
      - CORS_ALLOWED_ORIGINS=${DOMAIN_NAME}
      - CSRF_TRUSTED_ORIGINS=${DOMAIN_NAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c '
      set +e;
      echo "Waiting for PostgreSQL...";
      retries=0;
      max_retries=30;
      until python -c "import socket, sys; s=socket.socket(); s.settimeout(2); s.connect((sys.argv[1], int(sys.argv[2]))); s.close()" "$$DBHOST" "$$DBPORT"; do
        retries=$$((retries + 1));
        if [ $$retries -ge $$max_retries ]; then
          echo "=== TIMED OUT WAITING FOR POSTGRES ===";
          exec sleep infinity;
        fi;
        echo "  not ready yet ($$retries/$$max_retries)...";
        sleep 1;
      done;
      echo "PostgreSQL is ready.";
      echo "Ensuring crm_user role exists...";
      python -c "import sys, psycopg2; host, port, superuser, superpass, dbname, targetuser, targetpass = sys.argv[1:8]; conn = psycopg2.connect(host=host, port=int(port), user=superuser, password=superpass, dbname=dbname); conn.autocommit = True; cur = conn.cursor(); cur.execute(\"SELECT 1 FROM pg_roles WHERE rolname=%s\", (targetuser,)); row = cur.fetchone(); cur.execute((\"ALTER ROLE \" if row else \"CREATE ROLE \") + targetuser + \" WITH LOGIN PASSWORD %s\", (targetpass,)); cur.execute(\"GRANT ALL PRIVILEGES ON DATABASE \" + dbname + \" TO \" + targetuser); cur.close(); conn.close(); print(\"crm_user role ensured\")" "$$DBHOST" "$$DBPORT" postgres "$$POSTGRES_SUPER_PASSWORD" "$$DBNAME" "$$DBUSER" "$$DBPASSWORD";
      rc=$$?;
      if [ $$rc -ne 0 ]; then echo "=== ROLE SETUP FAILED rc=$$rc ==="; exec sleep infinity; fi;
      echo "Running migrations...";
      python manage.py migrate --noinput;
      rc=$$?;
      if [ $$rc -ne 0 ]; then echo "=== MIGRATE FAILED rc=$$rc ==="; exec sleep infinity; fi;
      echo "Creating default admin user...";
      python manage.py create_default_admin;
      rc=$$?;
      if [ $$rc -ne 0 ]; then echo "=== CREATE_ADMIN FAILED rc=$$rc ==="; exec sleep infinity; fi;
      echo "Collecting static files...";
      python manage.py collectstatic --noinput;
      rc=$$?;
      if [ $$rc -ne 0 ]; then echo "=== COLLECTSTATIC FAILED rc=$$rc ==="; exec sleep infinity; fi;
      echo "Starting server...";
      exec python manage.py runserver 0.0.0.0:8000
      '


volumes:
  postgres_data_v2:
