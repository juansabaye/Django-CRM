services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_SUPER_PASSWORD}
      - CRM_USER_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-rls-user.sh:/docker-entrypoint-initdb.d/init-rls-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SWAGGER_ROOT_URL=${DOMAIN_NAME}
      - CORS_ALLOW_ALL=False
      - CORS_ALLOWED_ORIGINS=${DOMAIN_NAME}
      - CSRF_TRUSTED_ORIGINS=${DOMAIN_NAME}
      - DBPASSWORD=${DB_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c '
      set +e;
      echo "Waiting for PostgreSQL...";
      retries=0;
      max_retries=30;
      until (echo > /dev/tcp/$$DBHOST/$$DBPORT) 2>/dev/null; do
        retries=$$((retries + 1));
        if [ $$retries -ge $$max_retries ]; then
          echo "=== TIMED OUT WAITING FOR POSTGRES ===";
          exec sleep infinity;
        fi;
        echo "  not ready yet ($$retries/$$max_retries)...";
        sleep 1;
      done;
      echo "PostgreSQL is ready.";
      echo "Running migrations...";
      python manage.py migrate --noinput;
      rc=$$?;
      if [ $$rc -ne 0 ]; then echo "=== MIGRATE FAILED rc=$$rc ==="; exec sleep infinity; fi;
      echo "Creating default admin user...";
      python manage.py create_default_admin;
      rc=$$?;
      if [ $$rc -ne 0 ]; then echo "=== CREATE_ADMIN FAILED rc=$$rc ==="; exec sleep infinity; fi;
      echo "Collecting static files...";
      python manage.py collectstatic --noinput;
      rc=$$?;
      if [ $$rc -ne 0 ]; then echo "=== COLLECTSTATIC FAILED rc=$$rc ==="; exec sleep infinity; fi;
      echo "Starting server...";
      exec python manage.py runserver 0.0.0.0:8000
      '


volumes:
  postgres_data:
  backend_venv:
