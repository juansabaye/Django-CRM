services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_SUPER_PASSWORD}
      - CRM_USER_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-rls-user.sh:/docker-entrypoint-initdb.d/init-rls-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SWAGGER_ROOT_URL=${DOMAIN_NAME}
      - CORS_ALLOW_ALL=False
      - CORS_ALLOWED_ORIGINS=${DOMAIN_NAME}
      - CSRF_TRUSTED_ORIGINS=${DOMAIN_NAME}
      - DBPASSWORD=${DB_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - ./docker/backend/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/bash /entrypoint.sh

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SWAGGER_ROOT_URL=${DOMAIN_NAME}
      - CORS_ALLOW_ALL=False
      - CORS_ALLOWED_ORIGINS=${DOMAIN_NAME}
      - CSRF_TRUSTED_ORIGINS=${DOMAIN_NAME}
      - DBPASSWORD=${DB_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A crm worker --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SWAGGER_ROOT_URL=${DOMAIN_NAME}
      - CORS_ALLOW_ALL=False
      - CORS_ALLOWED_ORIGINS=${DOMAIN_NAME}
      - CSRF_TRUSTED_ORIGINS=${DOMAIN_NAME}
      - DBPASSWORD=${DB_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A crm beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      - PUBLIC_DJANGO_API_URL=${DOMAIN_NAME}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: 'tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}'
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  frontend_node_modules:
  backend_venv:
